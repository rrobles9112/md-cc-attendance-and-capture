name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'

jobs:
  full-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse PWA Audit
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          configPath: '.lighthouserc.json'
          urls: |
            http://localhost:3000
            http://localhost:3000/login

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: npm Audit
        run: npm audit --audit-level=high
        continue-on-error: true

  create-issue-on-failure:
    needs: [full-test, lighthouse, security-audit]
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Create Failure Issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly build failed — ${new Date().toISOString().split('T')[0]}`;
            const body = `## Nightly Build Failure\n\nThe nightly CI job failed. Check the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) for details.\n\n### Jobs\n- Full Test: ${{ needs.full-test.result }}\n- Lighthouse: ${{ needs.lighthouse.result }}\n- Security Audit: ${{ needs.security-audit.result }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['ci-failure', 'nightly'],
            });
