name: Deploy Preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Require public Supabase build vars
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY must be set as GitHub Actions variables."
            exit 1
          fi
      - run: npm ci
      - run: npm run build

  deploy-vercel:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Deploy to Vercel Preview
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel --prod=false --token=$VERCEL_TOKEN --yes > vercel-output.txt
          PREVIEW_URL=$(cat vercel-output.txt | tail -1)
          echo "preview-url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"

  supabase-migrate-validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply migrations on ephemeral local Supabase
        run: |
          # Hard fail on SQL errors — do not soft-swallow with || true
          supabase start --ignore-health-check
          supabase db reset --yes
      - name: List linked remote migrations (informational)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          npx supabase link --project-ref="$SUPABASE_PROJECT_REF"
          npx supabase migration list --linked
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  post-comment:
    needs: [deploy-vercel, supabase-migrate-validate]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Post Preview URL as PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ needs.deploy-vercel.outputs.url }}';
            const body = `## Preview Deployment\n\n🔗 **Preview URL:** ${url}\n\nLocal Supabase migration apply validation completed (ephemeral \`db reset\`).`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body,
            });
