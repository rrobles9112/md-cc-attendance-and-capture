name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

  lint:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  test:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx vitest run

  db-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          # Pinned: supabase CLI 2.112.0 has a regression parsing the management
          # API response ("failed to get api keys: SchemaError ... inserted_at"),
          # breaking `link` / `migration list --linked` / `db push`. 2.111.0 is
          # the last version proven to deploy this project successfully.
          version: 2.111.0
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Start local Supabase and apply migrations + seed
        run: |
          supabase start --ignore-health-check
          supabase db reset --yes
      - name: Run SQL integration tests
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          echo "==> Verify demo seed users exist"
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c \
            "SELECT email FROM auth.users WHERE email LIKE 'test-%@test.com' ORDER BY email;"
          # Trigger / crypto tests as postgres (table owner)
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/audit_trigger.test.sql
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/pgcrypto.test.sql
          # RLS tests must run as non-superuser so policies are enforced
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -c "SET ROLE authenticated" \
            -f supabase/tests/rls.test.sql
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup || true

  build:
    needs: [lint, typecheck, test, db-integration]
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Require public Supabase build vars
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY must be set as GitHub Actions variables."
            exit 1
          fi
      - run: npm ci
      - run: npm run build
